spring.application.name=hubpieces

spring.datasource.url=jdbc:mysql://localhost:3306/hubpieces_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

server.port=9090

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

# Documentation interactive (même origine et même session que l'application)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.csrf.enabled=true
springdoc.api-docs.path=/v3/api-docs
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
