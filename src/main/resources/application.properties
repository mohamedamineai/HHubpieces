spring.application.name=hubpieces

spring.datasource.url=jdbc:mysql://localhost:3306/hubpieces_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.main.allow-bean-definition-overriding=true

# L'authentification est 100% geree par AuthController (/api/auth/login) + HttpSession.
# On supprime donc l'utilisateur memoire par defaut de Spring Boot, qui n'a aucun role ici
# et qui affiche au demarrage la ligne trompeuse "Using generated security password: ...".
# On exclut aussi ServletWebSecurityAutoConfiguration : sa chaine par defaut
# (defaultSecurityFilterChain : anyRequest().authenticated() + formLogin + httpBasic)
# servirait sinon TOUTES les requetes et afficherait la page "Please sign in".
# Sans risque : HttpSecurity retombe sur le shared object PathPatternRequestMatcher
# (HttpSecurity.getIfUnique, alimente par HttpSecurityConfiguration) et SecurityConfig
# porte deja @EnableWebSecurity.
# (FQCN verifies dans Spring Boot 4.0.8 : module/spring-boot-security, listes dans
#  META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration

server.port=9090

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=false
springdoc.swagger-ui.try-it-out-enabled=true
