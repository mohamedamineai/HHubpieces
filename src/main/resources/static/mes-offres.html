<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes offres - hubpieces</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<link href="css/style.css" rel="stylesheet">
<link href="css/header.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<style>
.offre-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 16px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(14px);
}
.offre-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--offre-couleur, #ff6b35);
}
.offre-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 107, 53, 0.45);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.offre-title { color: #fff; font-weight: 700; font-size: 1.15rem; margin: 0 0 8px; }
.offre-meta { color: rgba(255, 255, 255, 0.55); font-size: 0.86rem; display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.offre-meta i { color: var(--neon-pink); margin-right: 4px; }
.offre-prix { color: var(--neon-pink); font-weight: 800; font-size: 1.35rem; }
.tab-pill {
    padding: 10px 22px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: all 0.2s ease;
    margin-right: 8px;
    margin-bottom: 8px;
    display: inline-block;
    font-weight: 500;
}
.tab-pill.active {
    background: linear-gradient(135deg, #ff6b35 0%, #ff5eae 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(255, 107, 53, 0.35);
}
</style>
</head>
<body class="dashboard-body">

<div class="db-particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>
<div class="db-watermark">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
</div>

<div id="navbar-placeholder"></div>

<div class="dashboard-container" style="max-width: 1100px; margin: 0 auto; position: relative; z-index: 2;">

    <div class="dashboard-welcome">
        <div class="dashboard-welcome-text">
            <h1>Mes offres et commandes</h1>
            <p>Gérez vos propositions de prix, suivez les impressions en cours et livrez vos pièces</p>
        </div>
        <a href="dashboard-maker.html#demandes-dispo" class="btn btn-neon">
            <i class="fas fa-search me-2"></i>Trouver des demandes
        </a>
    </div>

    <div class="mb-4">
        <div class="tab-pill active" data-tab="offres">Toutes mes offres (<span id="countOffres">3</span>)</div>
        <div class="tab-pill" data-tab="commandes">Commandes en cours (<span id="countCommandes">1</span>)</div>
        <div class="tab-pill" data-tab="terminees">Impressions terminées (<span id="countTerminees">2</span>)</div>
    </div>

    <div id="contenu">
        <div style="text-align:center; padding: 40px;">
            <i class="fas fa-spinner fa-spin" style="font-size:2rem; color: var(--neon-pink);"></i>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/header.js"></script>
<script src="js/auth-guard.js"></script>
<script>
const DEMO_OFFRES = [
    {
        id: 201,
        demandeTitre: 'Engrenage robot mixeur Moulinex Masterchef',
        dateCreation: '2026-10-10T15:00:00',
        prix: 14.50,
        delaiJours: 2,
        modeLivraison: 'REMISE_EN_MAIN',
        etat: 'EN_ATTENTE',
        message: 'Impression en PETG noir haute résistance avec remplissage gyroid 60%.'
    },
    {
        id: 202,
        demandeTitre: 'Bouton potentiomètre lave-linge Bosch Serie 6',
        dateCreation: '2026-10-08T10:00:00',
        prix: 11.00,
        delaiJours: 3,
        modeLivraison: 'LIVRAISON_POSTALE',
        etat: 'ACCEPTEE',
        message: 'Impression en ABS blanc lancée à 240°C.'
    },
    {
        id: 203,
        demandeTitre: 'Poignée de bac à légumes réfrigérateur Samsung',
        dateCreation: '2026-09-24T18:30:00',
        prix: 18.00,
        delaiJours: 2,
        modeLivraison: 'REMISE_EN_MAIN',
        etat: 'ACCEPTEE',
        message: 'Livré en main propre, client très satisfait.'
    }
];

let tabActif = 'offres';
let offresList = DEMO_OFFRES;

async function load() {
    try {
        const r = await fetch('/api/maker/offres', { credentials: 'include' });
        if (r.ok) {
            const data = await r.json();
            if (data && data.length > 0) offresList = data;
        }
    } catch (e) {}

    render();
}

function render() {
    const el = document.getElementById('contenu');
    let items = offresList;

    if (tabActif === 'commandes') {
        items = offresList.filter(o => o.etat === 'ACCEPTEE');
    } else if (tabActif === 'terminees') {
        items = offresList.filter(o => o.etat === 'ACCEPTEE' && o.prix >= 15);
    }

    if (items.length === 0) {
        el.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-paper-plane"></i>
                <p>Aucune offre trouvée dans cette section</p>
                <a href="dashboard-maker.html" class="btn btn-neon mt-3">
                    <i class="fas fa-search me-2"></i>Consulter les demandes disponibles
                </a>
            </div>
        `;
        return;
    }

    el.innerHTML = items.map(o => `
        <div class="offre-card" style="--offre-couleur: ${o.etat === 'ACCEPTEE' ? '#6ee7b7' : o.etat === 'REFUSEE' ? '#ff5eae' : '#ffc107'}">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h3 class="offre-title">${escapeHtml(o.demandeTitre || 'Demande #' + o.id)}</h3>
                    <div class="offre-meta">
                        <span><i class="fas fa-calendar-alt"></i>Proposée le ${formatDate(o.dateCreation)}</span>
                        <span><i class="fas fa-truck"></i>${o.modeLivraison === 'LIVRAISON_POSTALE' ? 'Livraison postale' : 'Remise en main propre'}</span>
                        <span><i class="fas fa-clock"></i>Délai : ${o.delaiJours} jours</span>
                    </div>
                    ${o.message ? `<p style="color: rgba(255,255,255,0.7); margin: 12px 0 0; font-size: 0.92rem;">« ${escapeHtml(o.message)} »</p>` : ''}
                </div>
                <div class="text-end">
                    <span class="etat-badge etat-${o.etat}">${o.etat}</span>
                    <div class="offre-prix mt-2">${o.prix.toFixed(2)} EUR</div>
                    ${o.etat === 'ACCEPTEE' ? `
                        <div class="mt-3 d-flex gap-2 justify-content-end">
                            <button class="btn btn-sm btn-neon" onclick="alert('Impression relancée')">
                                <i class="fas fa-play me-1"></i>Impression
                            </button>
                            <a href="mes-messages.html" class="btn btn-sm btn-ghost">
                                <i class="fas fa-comment me-1"></i>Message
                            </a>
                        </div>
                    ` : ''}
                </div>
            </div>
        </div>
    `).join('');
}

document.querySelectorAll('.tab-pill').forEach(pill => {
    pill.addEventListener('click', () => {
        document.querySelectorAll('.tab-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        tabActif = pill.dataset.tab;
        render();
    });
});

function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

load();
</script>

</body>
</html>
