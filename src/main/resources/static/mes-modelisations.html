<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes modélisations - hubpieces</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<link href="css/style.css" rel="stylesheet">
<link href="css/header.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<style>
.demande-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 16px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(14px);
}
.demande-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: #9d4edd;
}
.demande-card:hover {
    transform: translateY(-2px);
    border-color: rgba(157, 78, 221, 0.45);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.demande-title { color: #fff; font-weight: 700; font-size: 1.15rem; margin: 0 0 8px; }
.demande-meta { color: rgba(255, 255, 255, 0.55); font-size: 0.86rem; display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.demande-meta i { color: var(--neon-pink); margin-right: 4px; }
.tab-pill {
    padding: 10px 22px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: all 0.2s ease;
    margin-right: 8px;
    margin-bottom: 8px;
    display: inline-block;
    font-weight: 500;
}
.tab-pill.active {
    background: linear-gradient(135deg, #9d4edd 0%, #ff5eae 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(157, 78, 221, 0.35);
}
</style>
</head>
<body class="dashboard-body">

<div class="db-particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>
<div class="db-watermark">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
</div>

<div id="navbar-placeholder"></div>

<div class="dashboard-container" style="max-width: 1100px; margin: 0 auto; position: relative; z-index: 2;">

    <div class="dashboard-welcome">
        <div class="dashboard-welcome-text">
            <h1>Mes modélisations CAO</h1>
            <p>Espace Expert CAO : créez les modèles 3D pour les demandeurs et enrichissez le catalogue</p>
        </div>
        <a href="catalogue.html" class="btn btn-neon">
            <i class="fas fa-cubes me-2"></i>Catalogue STL
        </a>
    </div>

    <div class="mb-4">
        <div class="tab-pill active" data-tab="a-modeliser">Demandes à modéliser (<span id="c1">2</span>)</div>
        <div class="tab-pill" data-tab="mes-fichiers">Mes fichiers STL validés (<span id="c2">4</span>)</div>
    </div>

    <div id="contenu">
        <div style="text-align:center; padding: 40px;">
            <i class="fas fa-spinner fa-spin" style="font-size:2rem; color: var(--neon-pink);"></i>
        </div>
    </div>

</div>

<!-- Modal Formulaire Modélisation STL -->
<div class="modal fade" id="stlModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" style="color: #fff; font-weight: 700;">
                    <i class="fas fa-magic me-2" style="color: var(--neon-pink);"></i>
                    Transmettre le modèle 3D
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="stlForm">
                <div class="modal-body">
                    <input type="hidden" id="demandeIdModelisation">
                    <div class="row g-3">
                        <div class="col-md-6 form-floating">
                            <input type="text" class="form-control" id="stlNom" required placeholder="Nom">
                            <label for="stlNom">Nom de la pièce *</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <select class="form-select" id="stlCategorie">
                                <option value="electromenager">Électroménager</option>
                                <option value="automobile">Automobile</option>
                                <option value="quotidien">Quotidien</option>
                                <option value="bricolage">Bricolage</option>
                            </select>
                            <label for="stlCategorie">Catégorie</label>
                        </div>
                        <div class="col-12 form-floating">
                            <textarea class="form-control" id="stlDescription" style="height: 90px;" placeholder="Description"></textarea>
                            <label for="stlDescription">Description technique et tolérances</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="text" class="form-control" id="stlMarque" placeholder="Marque">
                            <label for="stlMarque">Marque de l'appareil</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="text" class="form-control" id="stlModele" placeholder="Modèle">
                            <label for="stlModele">Modèle de l'appareil</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="text" class="form-control" id="stlMateriau" value="PETG" placeholder="Matériau">
                            <label for="stlMateriau">Matériau recommandé</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="text" class="form-control" id="stlChemin" value="images/model1.glb" placeholder="Fichier">
                            <label for="stlChemin">Fichier 3D (.glb / .stl)</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-neon">
                        <i class="fas fa-check me-2"></i>Valider la modélisation
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/header.js"></script>
<script src="js/auth-guard.js"></script>
<script>
const DEMO_A_MODELISER = [
    {
        id: 4,
        titre: 'Support filtre aspirateur sans fil Dyson V8',
        description: 'Pattes de verrouillage brisées. Photos prises avec pied à coulisse fournies. Besoin d\'un fichier 3D étanche.',
        marque: 'Dyson',
        modeleAppareil: 'V8 Absolute',
        materiauSouhaite: 'PLA ou PETG',
        budgetMax: 25.00,
        ville: 'Lyon',
        dateCreation: '2026-10-11T11:20:00'
    },
    {
        id: 7,
        titre: 'Bague de fixation blender Philips Viva',
        description: 'Filetage abîmé lors du vissage. Dimensions intérieures : diamètre 68mm, pas de vis 2.5mm.',
        marque: 'Philips',
        modeleAppareil: 'HR2162',
        materiauSouhaite: 'PETG alimentaire',
        budgetMax: 18.00,
        ville: 'Bordeaux',
        dateCreation: '2026-10-09T16:40:00'
    }
];

const DEMO_MES_FICHIERS = [
    {
        id: 1,
        nom: 'Engrenage denté précision Moulinex',
        description: 'Pignon d\'entraînement hélicoïdal à haute résistance mécanique.',
        categorie: 'electromenager',
        marque: 'Moulinex',
        materiauRecommande: 'PETG / Nylon',
        nombreTelechargements: 48,
        noteMoyenne: 4.9,
        etatValidation: 'VALIDE'
    },
    {
        id: 2,
        nom: 'Support articulé multi-axe universel',
        description: 'Rotule orientable à double serrage pour lampes et caméras.',
        categorie: 'quotidien',
        marque: 'Universel',
        materiauRecommande: 'PLA haute densité',
        nombreTelechargements: 76,
        noteMoyenne: 4.8,
        etatValidation: 'VALIDE'
    },
    {
        id: 3,
        nom: 'Molette crantée de réglage Peugeot',
        description: 'Bouton moleté intérieur méplat pour tableau de bord.',
        categorie: 'automobile',
        marque: 'Peugeot / Renault',
        materiauRecommande: 'ABS',
        nombreTelechargements: 35,
        noteMoyenne: 5.0,
        etatValidation: 'VALIDE'
    },
    {
        id: 4,
        nom: 'Embout adaptateur turbine Dyson',
        description: 'Raccord conique étanche pour flux d\'air haute vélocité.',
        categorie: 'electromenager',
        marque: 'Dyson',
        materiauRecommande: 'PETG',
        nombreTelechargements: 92,
        noteMoyenne: 4.9,
        etatValidation: 'VALIDE'
    }
];

let tabActif = 'a-modeliser';

async function load() {
    render();
}

function render() {
    const el = document.getElementById('contenu');
    if (tabActif === 'a-modeliser') {
        if (DEMO_A_MODELISER.length === 0) {
            el.innerHTML = `<div class="empty-state"><i class="fas fa-check-circle"></i><p>Toutes les demandes ont été modélisées !</p></div>`;
            return;
        }
        el.innerHTML = DEMO_A_MODELISER.map(d => `
            <div class="demande-card">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                    <div>
                        <h3 class="demande-title">${escapeHtml(d.titre)}</h3>
                        <p style="color: rgba(255,255,255,0.7); margin: 0 0 10px; line-height: 1.6;">${escapeHtml(d.description)}</p>
                        <div class="demande-meta">
                            ${d.marque ? `<span><i class="fas fa-tag"></i>${escapeHtml(d.marque)}</span>` : ''}
                            ${d.materiauSouhaite ? `<span><i class="fas fa-cube"></i>${escapeHtml(d.materiauSouhaite)}</span>` : ''}
                            ${d.ville ? `<span><i class="fas fa-map-marker-alt"></i>${escapeHtml(d.ville)}</span>` : ''}
                            <span><i class="fas fa-clock"></i>${formatDate(d.dateCreation)}</span>
                            <span style="color:#6ee7b7; font-weight:700;"><i class="fas fa-coins"></i>${d.budgetMax.toFixed(2)} EUR</span>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-neon" onclick="openSTLModal(${d.id}, '${escapeHtml(d.titre).replace(/'/g, "\\'")}', '${escapeHtml(d.marque || '')}', '${escapeHtml(d.modeleAppareil || '')}')">
                            <i class="fas fa-magic me-1"></i>Modéliser en 3D
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    } else {
        el.innerHTML = DEMO_MES_FICHIERS.map(f => `
            <div class="demande-card" style="--etat-couleur: #6ee7b7;">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                    <div>
                        <h3 class="demande-title">${escapeHtml(f.nom)}</h3>
                        <p style="color: rgba(255,255,255,0.7); margin: 0 0 10px;">${escapeHtml(f.description)}</p>
                        <div class="demande-meta">
                            <span><i class="fas fa-tag"></i>${escapeHtml(f.marque)}</span>
                            <span><i class="fas fa-cube"></i>${escapeHtml(f.materiauRecommande)}</span>
                            <span><i class="fas fa-download"></i>${f.nombreTelechargements} téléchargements</span>
                            <span><i class="fas fa-star" style="color:#ffc107;"></i>${f.noteMoyenne}/5</span>
                        </div>
                    </div>
                    <span class="etat-badge etat-CLOTUREE">Validé par admin</span>
                </div>
            </div>
        `).join('');
    }
}

function openSTLModal(demandeId, titre, marque, modele) {
    document.getElementById('demandeIdModelisation').value = demandeId;
    document.getElementById('stlNom').value = titre;
    document.getElementById('stlMarque').value = marque;
    document.getElementById('stlModele').value = modele;
    new bootstrap.Modal(document.getElementById('stlModal')).show();
}

document.getElementById('stlForm').addEventListener('submit', e => {
    e.preventDefault();
    alert('Modélisation enregistrée avec succès ! Le demandeur est notifié.');
    bootstrap.Modal.getInstance(document.getElementById('stlModal')).hide();
});

document.querySelectorAll('.tab-pill').forEach(pill => {
    pill.addEventListener('click', () => {
        document.querySelectorAll('.tab-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        tabActif = pill.dataset.tab;
        render();
    });
});

function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

load();
</script>

</body>
</html>
