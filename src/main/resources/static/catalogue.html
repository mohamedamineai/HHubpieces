<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue STL - hubpieces</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<link href="css/style.css" rel="stylesheet">
<link href="css/header.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<style>
.catalogue-hero {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(250px, 0.75fr);
    align-items: center;
    gap: clamp(20px, 4vw, 52px);
    background:
        radial-gradient(ellipse at 82% 40%, rgba(255,94,174,0.12), transparent 45%),
        linear-gradient(135deg, rgba(157,78,221,0.14) 0%, rgba(10,5,20,0.92) 100%);
    border-radius: 24px;
    padding: clamp(24px, 4vw, 44px) clamp(20px, 4vw, 40px);
    margin: 20px auto 32px;
    max-width: 1200px;
    border: 1px solid rgba(255,255,255,0.08);
    text-align: left;
    position: relative;
    backdrop-filter: blur(16px);
}
.catalogue-hero-copy {
    position: relative;
    z-index: 1;
}
.catalogue-hero h1 {
    font-size: 2.5rem;
    font-weight: 800;
    margin: 0 0 12px;
}
.catalogue-hero .gradient-text {
    background: linear-gradient(135deg, #9d4edd 0%, #ff5eae 72%, #ffffff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.catalogue-hero-art {
    position: relative;
    z-index: 1;
    margin: 0;
}
.catalogue-hero-art-stage {
    display: grid;
    place-items: center;
    min-height: 250px;
    overflow: hidden;
    border: 1px solid rgba(255,94,174,0.18);
    border-radius: 20px;
    background:
        radial-gradient(ellipse at center, rgba(157,78,221,0.16), transparent 68%),
        linear-gradient(145deg, rgba(10,5,20,0.2), rgba(26,11,51,0.28));
}
.catalogue-hero-model {
    display: block;
    width: 100%;
    max-width: 380px;
    height: clamp(210px, 26vw, 300px);
    background: transparent;
    --progress-bar-color: transparent;
    --poster-color: transparent;
}
.catalogue-hero-art figcaption {
    margin-top: 9px;
    color: rgba(255,255,255,0.65);
    font-size: 0.78rem;
    line-height: 1.5;
    text-align: center;
}
.catalogue-hero-art figcaption i {
    margin-right: 5px;
    color: #ff5eae;
}
.stl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto 60px;
    padding: 0 24px;
}
.stl-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.35s ease;
    cursor: pointer;
    position: relative;
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
}
.stl-card:hover {
    transform: translateY(-6px);
    border-color: rgba(255,107,53,0.5);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.stl-preview {
    height: 220px;
    background: linear-gradient(135deg, rgba(13,27,62,0.8) 0%, rgba(10,5,20,0.95) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}
.stl-preview model-viewer {
    width: 100%;
    height: 100%;
    --progress-bar-color: transparent;
}
.stl-info {
    padding: 20px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.stl-name {
    color: #fff;
    font-weight: 700;
    font-size: 1.1rem;
    margin: 0 0 8px;
}
.stl-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    color: rgba(255,255,255,0.55);
    font-size: 0.85rem;
    margin-top: 10px;
}
.stl-meta i { color: var(--neon-pink); margin-right: 4px; }
.filtre-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 24px auto 32px;
    max-width: 1200px;
    padding: 0 24px;
}
.filtre-pill {
    padding: 8px 18px;
    border-radius: 30px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.9rem;
    font-weight: 500;
}
.filtre-pill.active, .filtre-pill:hover {
    background: linear-gradient(135deg, #ff6b35 0%, #ff5eae 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(255,107,53,0.35);
}
@media (max-width: 760px) {
    .catalogue-hero {
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
        text-align: center;
    }
    .catalogue-hero-copy { text-align: center; }
    .catalogue-hero-art {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
    }
}
@media (max-width: 420px) {
    .catalogue-hero-art-stage { min-height: 205px; }
    .catalogue-hero-model { height: 210px; }
}
</style>
</head>
<body class="dashboard-body">

<div class="db-particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>
<div class="db-watermark">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
</div>

<div id="navbar-placeholder"></div>

<div style="position: relative; z-index: 1;">

    <section class="catalogue-hero" aria-labelledby="catalogue-title">
        <div class="catalogue-hero-copy">
            <h1 id="catalogue-title">
                <i class="fas fa-cubes me-2" style="color: #ff5eae;" aria-hidden="true"></i>
                Catalogue <span class="gradient-text">STL & 3D</span>
            </h1>
            <p style="color: rgba(255,255,255,0.75); font-size: 1.1rem; max-width: 650px; margin: 0; line-height: 1.6;">
                Explorez notre bibliothèque de modèles 3D vérifiés par nos experts CAO. Téléchargez les fichiers ou demandez leur impression à un maker local.
            </p>
        </div>
        <figure class="catalogue-hero-art">
            <div class="catalogue-hero-art-stage">
                <model-viewer
                    class="catalogue-hero-model"
                    src="images/circuit-board.glb"
                    alt="Carte électronique 3D décorative qui évoque la réparation numérique, non disponible comme article du catalogue"
                    data-motion-auto-rotate
                    auto-rotate
                    auto-rotate-delay="0"
                    rotation-per-second="16deg"
                    camera-controls
                    disable-zoom
                    loading="lazy"
                    tabindex="0"
                    shadow-intensity="0.55"
                    exposure="1.05">
                </model-viewer>
            </div>
            <figcaption><i class="fas fa-circle-info" aria-hidden="true"></i>Illustration du catalogue — visuel décoratif, non téléchargeable.</figcaption>
        </figure>
    </section>

    <div class="filtre-bar" id="filtres">
        <div class="filtre-pill active" data-categorie="">Toutes catégories</div>
        <div class="filtre-pill" data-categorie="electromenager">Électroménager</div>
        <div class="filtre-pill" data-categorie="automobile">Automobile</div>
        <div class="filtre-pill" data-categorie="quotidien">Quotidien</div>
        <div class="filtre-pill" data-categorie="bricolage">Bricolage</div>
    </div>

    <div class="stl-grid" id="grid">
        <div class="empty-state" style="grid-column: 1/-1;">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Chargement des modèles 3D...</p>
        </div>
    </div>

</div>

<script src="js/model-viewer-motion.js"></script>
<script src="js/header.js"></script>
<script>
// Modèles fabricables de secours avec les fichiers GLB de pièces réellement listées.
// circuit-board.glb reste uniquement une illustration du hero : ce n’est pas un FichierStl.
const FALLBACK_STL = [
    {
        id: 1,
        nom: 'Engrenage denté précision',
        description: 'Pignon d\'entraînement hélicoïdal à haute résistance mécanique. Idéal pour robots de cuisine et petits appareils électroménagers.',
        categorie: 'electromenager',
        marque: 'Moulinex',
        modeleAppareil: 'Masterchef',
        materiauRecommande: 'PETG / Nylon',
        cheminFichier: 'images/model1.glb',
        nombreTelechargements: 48,
        noteMoyenne: 4.9
    },
    {
        id: 2,
        nom: 'Support articulé multi-axe',
        description: 'Rotule orientable à double serrage pour lampes, caméras ou accessoires ménagers.',
        categorie: 'quotidien',
        marque: 'Universel',
        modeleAppareil: 'Standard 20mm',
        materiauRecommande: 'PLA haute densité',
        cheminFichier: 'images/model2.glb',
        nombreTelechargements: 76,
        noteMoyenne: 4.8
    },
    {
        id: 3,
        nom: 'Molette crantée de réglage',
        description: 'Bouton moleté intérieur méplat pour tableau de bord, climatisation ou commandes domestiques.',
        categorie: 'automobile',
        marque: 'Peugeot / Renault',
        modeleAppareil: 'Clio / 208',
        materiauRecommande: 'ABS résistant UV',
        cheminFichier: 'images/model3.glb',
        nombreTelechargements: 35,
        noteMoyenne: 5.0
    },
    {
        id: 4,
        nom: 'Embout adaptateur turbine',
        description: 'Raccord conique étanche pour filtration et flux d\'air haute vélocité.',
        categorie: 'electromenager',
        marque: 'Dyson',
        modeleAppareil: 'V8 / V10',
        materiauRecommande: 'PETG',
        cheminFichier: 'images/model4.glb',
        nombreTelechargements: 92,
        noteMoyenne: 4.9
    }
];

let catalogue = [];
let categorieActif = '';

async function load() {
    try {
        const r = await fetch('/api/public/catalogue-stl', { credentials: 'include' });
        if (r.ok) {
            const data = await r.json();
            catalogue = (data && data.length > 0) ? data : FALLBACK_STL;
        } else {
            catalogue = FALLBACK_STL;
        }
    } catch (e) {
        catalogue = FALLBACK_STL;
    }
    render();
}

function render() {
    const filtered = categorieActif === ''
        ? catalogue
        : catalogue.filter(f => (f.categorie || '').toLowerCase() === categorieActif.toLowerCase());
    const grid = document.getElementById('grid');

    if (filtered.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-cube"></i>
                <p>Aucun fichier STL pour cette catégorie</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = filtered.map(f => `
        <div class="stl-card" onclick="telecharger(${f.id})">
            <div class="stl-preview">
                ${f.cheminFichier && f.cheminFichier.endsWith('.glb')
                    ? `<model-viewer src="${f.cheminFichier}" alt="${escapeHtml(f.nom)}" auto-rotate camera-controls disable-zoom shadow-intensity="0.8" rotation-per-second="25deg"></model-viewer>`
                    : `<i class="fas fa-cube" style="font-size: 4rem; color: var(--orange-main);"></i>`}
            </div>
            <div class="stl-info">
                <div>
                    <h3 class="stl-name">${escapeHtml(f.nom)}</h3>
                    <p style="color: rgba(255,255,255,0.65); font-size: 0.9rem; margin: 0 0 10px; line-height: 1.5;">
                        ${escapeHtml((f.description || '').substring(0, 110))}${f.description && f.description.length > 110 ? '...' : ''}
                    </p>
                </div>
                <div>
                    <div class="stl-meta">
                        ${f.marque ? `<span><i class="fas fa-tag"></i>${escapeHtml(f.marque)}</span>` : ''}
                        ${f.materiauRecommande ? `<span><i class="fas fa-cube"></i>${escapeHtml(f.materiauRecommande)}</span>` : ''}
                        <span><i class="fas fa-download"></i>${f.nombreTelechargements || 0}</span>
                        <span><i class="fas fa-star" style="color:#ffc107;"></i>${(f.noteMoyenne || 5.0).toFixed(1)}</span>
                    </div>
                    <div class="mt-3 d-flex justify-content-between align-items-center">
                        <span class="badge" style="background: rgba(255,107,53,0.15); color: #ff8c5a; border: 1px solid rgba(255,107,53,0.3);">
                            ${escapeHtml(f.categorie || 'Pièce 3D')}
                        </span>
                        <span class="btn btn-sm btn-neon" style="padding: 4px 14px; font-size: 0.8rem;">
                            <i class="fas fa-download me-1"></i>Télécharger
                        </span>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

async function telecharger(id) {
    try {
        await fetch(`/api/public/catalogue-stl/${id}/telecharger`, { method: 'POST', credentials: 'include' });
    } catch (e) {}

    const fichier = catalogue.find(f => f.id === id);
    if (fichier) {
        alert('Téléchargement lancé pour : ' + fichier.nom + '\nFormat : 3D / STL vérifié.');
    }
}

document.getElementById('filtres').addEventListener('click', e => {
    const pill = e.target.closest('.filtre-pill');
    if (!pill) return;
    document.querySelectorAll('.filtre-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    categorieActif = pill.dataset.categorie;
    render();
});

function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

load();
</script>

</body>
</html>
