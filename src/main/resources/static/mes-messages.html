<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - hubpieces</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="css/header.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<style>
.message-list { max-width: 900px; margin: 0 auto; }
.message-item {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
}
.message-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9d4edd 0%, #ff5eae 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    flex-shrink: 0;
}
.message-body { flex: 1; }
.message-from { color: #fff; font-weight: 600; margin: 0; }
.message-content { color: rgba(255,255,255,0.7); margin: 6px 0; line-height: 1.5; }
.message-time { color: rgba(255,255,255,0.4); font-size: 0.8rem; }
.message-unread { border-left: 3px solid var(--neon-pink); }
.empty-state { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4); }
.empty-state i { font-size: 4rem; margin-bottom: 16px; opacity: 0.3; }
</style>
</head>
<body class="dashboard-body">

<div class="db-particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>
<div class="db-watermark">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
</div>

<div id="navbar-placeholder"></div>

<div class="dashboard-container">

    <div class="dashboard-welcome">
        <div class="dashboard-welcome-text">
            <h1>Mes messages</h1>
            <p>Conversations avec les autres utilisateurs</p>
        </div>
    </div>

    <div class="message-list" id="messageList">
        <div style="text-align:center; padding: 40px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--neon-pink);"></i>
        </div>
    </div>

</div>

<script src="js/header.js"></script>
<script>
let user = null;

async function load() {
    try {
        const r = await fetch('/api/auth/me', { credentials: 'include' });
        if (r.status === 401) { location.href = 'login.html'; return; }
        user = await r.json();
    } catch (e) { return; }

    // Determiner l'endpoint selon le role
    const endpoint = user.role === 'DEMANDEUR' ? '/api/demandeur/messages'
                   : user.role === 'MAKER' ? '/api/maker/messages'
                   : user.role === 'EXPERT_CAO' ? '/api/expert-cao/notifications'  // Pas de messagerie pour l'expert
                   : null;
    if (!endpoint) {
        document.getElementById('messageList').innerHTML = `
            <div class="empty-state">
                <i class="fas fa-envelope"></i>
                <p>La messagerie n'est pas encore disponible pour ce role</p>
            </div>
        `;
        return;
    }

    try {
        const r2 = await fetch(endpoint, { credentials: 'include' });
        if (!r2.ok) throw new Error('Erreur');
        const messages = await r2.json();
        const el = document.getElementById('messageList');
        if (messages.length === 0) {
            el.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-envelope-open"></i>
                    <p>Aucun message pour le moment</p>
                </div>
            `;
            return;
        }
        el.innerHTML = messages.map(m => {
            const isMine = m.expediteurId === user.userId;
            const initial = (isMine ? m.destinataireNom : m.expediteurNom || '?').charAt(0).toUpperCase();
            return `
                <div class="message-item ${m.lu ? '' : 'message-unread'}">
                    <div class="message-avatar">${initial}</div>
                    <div class="message-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h4 class="message-from">${isMine ? 'A ' + escapeHtml(m.destinataireNom) : 'De ' + escapeHtml(m.expediteurNom)}</h4>
                            <span class="message-time">${formatDate(m.dateEnvoi)}</span>
                        </div>
                        ${m.demandeTitre ? `<small style="color: var(--neon-pink);"><i class="fas fa-link"></i> ${escapeHtml(m.demandeTitre)}</small>` : ''}
                        <p class="message-content">${escapeHtml(m.contenu)}</p>
                    </div>
                </div>
            `;
        }).join('');
    } catch (e) {
        document.getElementById('messageList').innerHTML = `
            <div class="alert alert-danger">Erreur de chargement</div>
        `;
    }
}

function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

load();
</script>

</body>
</html>
