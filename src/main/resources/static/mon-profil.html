<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil - hubpieces</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="css/header.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<style>
.profil-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px;
}
.profil-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 24px;
}
.avatar-big {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9d4edd 0%, #ff5eae 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 2.5rem;
    box-shadow: 0 10px 40px rgba(255,94,174,0.3);
}
.form-floating > label { color: rgba(255,255,255,0.6); }
.form-control {
    background: rgba(0,0,0,0.3) !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
    color: #fff !important;
    transition: all 0.3s;
}
.form-control:focus {
    background: rgba(0,0,0,0.4) !important;
    border-color: var(--neon-pink) !important;
    box-shadow: 0 0 0 0.2rem rgba(255,94,174,0.15) !important;
    color: #fff !important;
}
.btn-neon {
    background: linear-gradient(135deg, #9d4edd 0%, #ff5eae 100%);
    border: none;
    color: #fff;
    padding: 12px 32px;
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(255,94,174,0.3);
}
.btn-neon:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,94,174,0.5); color: #fff; }
.alert-glass {
    background: rgba(110,231,183,0.1);
    border: 1px solid rgba(110,231,183,0.3);
    border-radius: 12px;
    color: #fff;
    padding: 12px 16px;
    display: none;
    margin-bottom: 16px;
}
.alert-glass.show { display: block; }
</style>
</head>
<body class="dashboard-body">

<div class="db-particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>
<div class="db-watermark">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
</div>

<div id="navbar-placeholder"></div>

<div class="profil-container">
    <div class="dashboard-welcome" style="margin-bottom: 24px;">
        <div class="dashboard-welcome-text">
            <h1>Mon profil</h1>
            <p>Gerez vos informations personnelles</p>
        </div>
    </div>

    <div id="alert" class="alert-glass"></div>

    <div class="profil-card">
        <div class="d-flex align-items-center gap-4 mb-4">
            <div class="avatar-big" id="avatarInit">?</div>
            <div>
                <h3 style="color: #fff; margin: 0;" id="nomComplet">Chargement...</h3>
                <p style="color: rgba(255,255,255,0.6); margin: 4px 0;" id="emailUser">-</p>
                <span class="role-pill" id="rolePill" style="display:none;"></span>
            </div>
        </div>

        <form id="profilForm">
            <div class="row g-2">
                <div class="col-6 form-floating mb-3">
                    <input type="text" class="form-control" id="nom" required>
                    <label for="nom">Nom</label>
                </div>
                <div class="col-6 form-floating mb-3">
                    <input type="text" class="form-control" id="prenom" required>
                    <label for="prenom">Prenom</label>
                </div>
            </div>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="telephone">
                <label for="telephone">Telephone</label>
            </div>
            <div class="row g-2">
                <div class="col-7 form-floating mb-3">
                    <input type="text" class="form-control" id="ville">
                    <label for="ville">Ville</label>
                </div>
                <div class="col-5 form-floating mb-3">
                    <input type="text" class="form-control" id="codePostal">
                    <label for="codePostal">Code postal</label>
                </div>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-neon flex-grow-1">
                    <i class="fas fa-save me-2"></i>Enregistrer
                </button>
            </div>
        </form>
    </div>

    <div class="profil-card" id="statsCard">
        <h4 style="color: #fff; margin-bottom: 16px;">
            <i class="fas fa-chart-line me-2" style="color: var(--neon-pink);"></i>
            Statistiques
        </h4>
        <div class="row g-3" id="statsRow">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>
</div>

<script src="js/header.js"></script>
<script src="js/auth-guard.js"></script>
<script>
let currentUser = null;

async function load() {
    try {
        const r = await fetch('/api/utilisateurs/me', { credentials: 'include' });
        if (r.status === 401) { location.href = 'login.html'; return; }
        if (!r.ok) throw new Error('Erreur');
        currentUser = await r.json();
        render();
    } catch (e) {
        document.getElementById('alert').textContent = 'Erreur de chargement du profil';
        document.getElementById('alert').classList.add('show');
    }
}

function render() {
    const initial = (currentUser.prenom || '?').charAt(0).toUpperCase() + (currentUser.nom || '').charAt(0).toUpperCase();
    document.getElementById('avatarInit').textContent = initial;
    document.getElementById('nomComplet').textContent = `${currentUser.prenom} ${currentUser.nom}`;
    document.getElementById('emailUser').textContent = currentUser.email || '';
    if (currentUser.rolePrincipal) {
        const pill = document.getElementById('rolePill');
        pill.textContent = currentUser.rolePrincipal.replace('_', ' ');
        pill.style.display = 'inline-block';
    }
    document.getElementById('nom').value = currentUser.nom || '';
    document.getElementById('prenom').value = currentUser.prenom || '';
    document.getElementById('telephone').value = currentUser.telephone || '';
    document.getElementById('ville').value = currentUser.ville || '';
    document.getElementById('codePostal').value = currentUser.codePostal || '';

    // Charger les stats selon le role
    if (currentUser.rolePrincipal === 'DEMANDEUR') loadStats('/api/demandeur/stats', [
        ['total', 'Demandes', 'fa-clipboard-list'],
        ['cloturees', 'Terminees', 'fa-check-double'],
        ['enCours', 'En cours', 'fa-print'],
        ['notificationsNonLues', 'Notifs', 'fa-bell']
    ]);
    else if (currentUser.rolePrincipal === 'MAKER') loadStats('/api/maker/stats', [
        ['offresTotal', 'Offres', 'fa-paper-plane'],
        ['commandesActives', 'Commandes', 'fa-print'],
        ['notificationsNonLues', 'Notifs', 'fa-bell']
    ]);
    else if (currentUser.rolePrincipal === 'EXPERT_CAO') loadStats('/api/expert-cao/stats', [
        ['demandesA modeliser', 'A modeliser', 'fa-cube'],
        ['fichiersTotal', 'Fichiers STL', 'fa-cubes'],
        ['notificationsNonLues', 'Notifs', 'fa-bell']
    ]);
}

async function loadStats(url, keys) {
    try {
        const r = await fetch(url, { credentials: 'include' });
        if (!r.ok) return;
        const data = await r.json();
        const row = document.getElementById('statsRow');
        row.innerHTML = keys.map(([k, label, icon]) => `
            <div class="col-md-3 col-6">
                <div style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px; text-align: center;">
                    <i class="fas ${icon}" style="color: var(--neon-pink); font-size: 1.3rem;"></i>
                    <div style="font-size: 1.6rem; font-weight: 800; color: #fff; margin: 4px 0;">${data[k] || 0}</div>
                    <div style="color: rgba(255,255,255,0.6); font-size: 0.85rem;">${label}</div>
                </div>
            </div>
        `).join('');
    } catch (e) {}
}

document.getElementById('profilForm').addEventListener('submit', async e => {
    e.preventDefault();
    const data = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        telephone: document.getElementById('telephone').value,
        ville: document.getElementById('ville').value,
        codePostal: document.getElementById('codePostal').value
    };
    try {
        const r = await fetch('/api/utilisateurs/me', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(data)
        });
        const alert = document.getElementById('alert');
        if (r.ok) {
            alert.textContent = 'Profil mis a jour avec succes !';
            alert.style.background = 'rgba(110,231,183,0.1)';
            alert.classList.add('show');
            setTimeout(() => alert.classList.remove('show'), 3000);
        } else {
            const err = await r.json();
            alert.textContent = err.message || 'Erreur';
            alert.style.background = 'rgba(255,94,174,0.1)';
            alert.classList.add('show');
        }
    } catch (e) {
        document.getElementById('alert').textContent = 'Erreur reseau';
        document.getElementById('alert').classList.add('show');
    }
});

load();
</script>

</body>
</html>
