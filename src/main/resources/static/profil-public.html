<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - hubpieces</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<link href="css/header.css" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Inter', sans-serif; background: radial-gradient(circle at 20% 20%, #1a0b33 0%, #0a0514 60%); min-height: 100vh; color: #fff; }
.profil-hero {
    background: linear-gradient(135deg, rgba(157,78,221,0.18) 0%, rgba(255,94,174,0.10) 100%);
    border-radius: 24px;
    padding: 48px 32px;
    margin: 32px auto;
    max-width: 900px;
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
}
.avatar-big {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9d4edd 0%, #ff5eae 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 3rem;
    margin: 0 auto 16px;
    box-shadow: 0 10px 40px rgba(255,94,174,0.3);
}
.role-pill {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 30px;
    background: linear-gradient(135deg, #9d4edd 0%, #ff5eae 100%);
    color: #fff;
    font-weight: 600;
    font-size: 0.85rem;
    margin: 8px 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.stat-row {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 16px;
    margin: 32px 0;
}
.stat-mini {
    text-align: center;
    padding: 20px;
    background: rgba(255,255,255,0.04);
    border-radius: 16px;
    flex: 1;
    min-width: 140px;
    border: 1px solid rgba(255,255,255,0.08);
}
.stat-mini-num { font-size: 1.8rem; font-weight: 800; color: #fff; }
.stat-mini-label { color: rgba(255,255,255,0.6); font-size: 0.85rem; }
.info-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
}
.info-card h5 { color: var(--neon-pink); margin-bottom: 12px; }
.info-card p { color: rgba(255,255,255,0.8); margin: 0; }
.avis-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
}
.stars { color: #ffc107; margin-bottom: 8px; }
.db-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.db-particles span {
    position: absolute;
    display: block;
    width: 6px; height: 6px;
    background: rgba(255,94,174,0.4);
    border-radius: 50%;
    animation: float 20s infinite linear;
}
.db-particles span:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
.db-particles span:nth-child(2) { top: 60%; left: 80%; animation-delay: 4s; }
.db-particles span:nth-child(3) { top: 80%; left: 20%; animation-delay: 8s; }
.db-particles span:nth-child(4) { top: 30%; left: 60%; animation-delay: 12s; }
.db-particles span:nth-child(5) { top: 10%; left: 50%; animation-delay: 16s; }
.db-particles span:nth-child(6) { top: 50%; left: 30%; animation-delay: 2s; }
.db-particles span:nth-child(7) { top: 70%; left: 70%; animation-delay: 6s; }
.db-particles span:nth-child(8) { top: 40%; left: 90%; animation-delay: 10s; }
@keyframes float {
    0% { transform: translateY(0) translateX(0); opacity: 0.4; }
    50% { transform: translateY(-100px) translateX(50px); opacity: 1; }
    100% { transform: translateY(0) translateX(0); opacity: 0.4; }
}
.db-watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.025; }
.db-watermark img { position: absolute; width: 280px; height: 280px; }
.db-watermark img:nth-child(1) { top: 10%; left: 5%; }
.db-watermark img:nth-child(2) { top: 50%; left: 70%; transform: rotate(45deg); }
.db-watermark img:nth-child(3) { top: 80%; left: 30%; transform: rotate(-30deg); }
</style>
</head>
<body>

<div class="db-particles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>
<div class="db-watermark">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
    <img src="images/logo_hub.png" alt="">
</div>

<div id="navbar-placeholder"></div>

<div style="position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 24px;">

    <div class="profil-hero" id="profilContainer">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i>
    </div>

    <div id="details"></div>

</div>

<script src="js/header.js"></script>
<script>
const params = new URLSearchParams(location.search);
const userId = params.get('id');

async function load() {
    if (!userId) { location.href = 'index.html'; return; }
    try {
        const r = await fetch(`/api/public/utilisateurs/${userId}`);
        if (!r.ok) throw new Error('Profil introuvable');
        const u = await r.json();
        render(u);
    } catch (e) {
        document.getElementById('profilContainer').innerHTML = `
            <i class="fas fa-user-slash" style="font-size: 3rem; color: rgba(255,94,174,0.5);"></i>
            <p>Profil introuvable</p>
        `;
    }
}

function render(u) {
    const initial = (u.prenom || '?').charAt(0).toUpperCase() + (u.nom || '').charAt(0).toUpperCase();
    document.getElementById('profilContainer').innerHTML = `
        <div class="avatar-big">${initial}</div>
        <h1 style="color: #fff; margin: 0 0 8px;">${escapeHtml(u.prenom)} ${escapeHtml(u.nom)}</h1>
        ${(u.roles || []).map(r => `<span class="role-pill">${r}</span>`).join('')}
        ${u.ville ? `<p style="color: rgba(255,255,255,0.6); margin-top: 12px;"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(u.ville)}</p>` : ''}
        <div class="stat-row">
            <div class="stat-mini">
                <div class="stat-mini-num"><i class="fas fa-star" style="color: #ffc107;"></i> ${(u.noteMoyenne || 0).toFixed(1)}/5</div>
                <div class="stat-mini-label">Note moyenne</div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-num">${u.nombreAvis || 0}</div>
                <div class="stat-mini-label">Avis</div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-num">${escapeHtml((u.ville || '-'))}</div>
                <div class="stat-mini-label">Localisation</div>
            </div>
        </div>
    `;
}

function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

load();
</script>

</body>
</html>
